<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacie F Keita</title>
<style>
  :root{
    --primary:#0F4C4C; --primary-dark:#0A3838; --mint:#EFF6F3; --surface:#FFFFFF;
    --amber:#B9812C; --amber-bg:#FBF1DF; --red:#B23A34; --red-bg:#FBE9E8;
    --text:#1B2E2B; --muted:#5C7A72; --border:#DCE7E2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--mint);color:var(--text);padding-bottom:84px;}
  .header{background:var(--primary);color:#fff;padding:18px 16px 14px;display:flex;align-items:center;justify-content:space-between;}
  .header .brand{display:flex;align-items:center;gap:10px;}
  .header .brand .icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .header .brand .title{font-size:16px;font-weight:700;}
  .header .brand .sub{font-size:11px;opacity:.75;}
  .vendor-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:none;color:#fff;padding:8px 10px;border-radius:20px;font-size:13px;cursor:pointer;}
  .content{padding:16px;}
  .card{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--border);}
  .empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13.5px;background:#fff;border-radius:14px;border:1px dashed var(--border);}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:13px 0;font-weight:700;font-size:14px;cursor:pointer;width:100%;}
  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap input{width:100%;padding:11px 12px 11px 34px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;background:#fff;}
  .search-icon{position:absolute;left:12px;top:12px;opacity:.5;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .prod-row{display:flex;align-items:center;justify-content:space-between;}
  .prod-name{font-weight:600;font-size:14px;}
  .prod-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .qty-btn{background:var(--primary);color:#fff;border:none;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--mint);border-radius:10px;padding:4px 6px;}
  .qty-ctrl button{background:#fff;border:1px solid var(--border);border-radius:8px;width:26px;height:26px;font-weight:700;color:var(--primary);cursor:pointer;}
  .qty-ctrl .plus{background:var(--primary);color:#fff;border:none;}
  .cart-bar{position:fixed;bottom:68px;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:14px;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
  .cart-top{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--muted);}
  .cart-top .total{font-weight:700;font-size:18px;color:var(--text);}
  .navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 6px;box-shadow:0 -2px 12px rgba(0,0,0,.06);}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:6px 0;color:var(--muted);cursor:pointer;position:relative;}
  .nav-btn.active{color:var(--primary);font-weight:700;}
  .nav-btn .label{font-size:10.5px;}
  .nav-btn .icon{font-size:19px;}
  .badge{position:absolute;top:-2px;right:14px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,30,28,.45);display:flex;align-items:flex-end;z-index:50;}
  .modal{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:20px;max-height:80vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head .title{font-weight:700;font-size:16px;}
  .modal-head button{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;}
  .vendor-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;font-weight:500;background:#fff;cursor:pointer;margin-bottom:8px;}
  .vendor-item.selected{border-color:var(--primary);background:var(--mint);}
  .section-title{font-size:13px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;}
  .trash-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
  .chips{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;white-space:nowrap;}
  .chip.active{border-color:var(--primary);background:var(--primary);color:#fff;}
  .stats-row{display:flex;gap:10px;margin-bottom:18px;}
  .stat-card{flex:1;background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);}
  .stat-label{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:6px;}
  .stat-value{font-size:19px;font-weight:800;color:var(--primary);}
  .stat-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .confirm-msg{background:var(--primary);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px;font-weight:600;}
</style>
</head>

<script>
/* ---------- Stockage local CHIFFRÉ (AES-256-GCM, dérivé du mot de passe) ---------- */
const OLD_DB_KEY = "pharma_caisse_db_v1"; // ancien format en clair, utilisé pour migration
const DATA_KEY = "pharma_caisse_enc_v1";
const SALT_KEY = "pharma_caisse_salt_v1";

function bufToBase64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToBuf(b64){ const bin = atob(b64); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr; }

function getOrCreateSalt(){
  let s = localStorage.getItem(SALT_KEY);
  if(!s){
    s = bufToBase64(crypto.getRandomValues(new Uint8Array(16)));
    localStorage.setItem(SALT_KEY, s);
  }
  return s;
}

async function deriveKey(password){
  const saltBytes = base64ToBuf(getOrCreateSalt());
  const keyMaterial = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), {name:"PBKDF2"}, false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:saltBytes, iterations:150000, hash:"SHA-256"},
    keyMaterial, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}

async function encryptDB(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(db));
  const cipherBuf = await crypto.subtle.encrypt({name:"AES-GCM", iv}, cryptoKey, data);
  return JSON.stringify({ iv: bufToBase64(iv), data: bufToBase64(cipherBuf) });
}
async function decryptDB(key, payloadStr){
  const payload = JSON.parse(payloadStr);
  const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv: base64ToBuf(payload.iv)}, key, base64ToBuf(payload.data));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

let cryptoKey = null;
let db = { vendors: [], products: [], sales: [], currentVendor: "", currentLocation: "Tous" };

async function saveDB(){
  if(!cryptoKey) return;
  const payload = await encryptDB();
  localStorage.setItem(DATA_KEY, payload);
}

// Retourne true si le mot de passe est correct (ou s'il vient d'être défini)
async function unlockWithPassword(password){
  const key = await deriveKey(password);
  const encRaw = localStorage.getItem(DATA_KEY);
  if(encRaw){
    try{
      db = await decryptDB(key, encRaw);
      cryptoKey = key;
      return true;
    }catch(e){
      return false; // mauvais mot de passe : le déchiffrement échoue
    }
  }
  // Aucune donnée chiffrée : première utilisation ou migration depuis l'ancien fichier
  const oldRaw = localStorage.getItem(OLD_DB_KEY);
  if(oldRaw){
    if(password.trim().toLowerCase() !== "f keita") return false; // migration protégée par l'ancien code
    try{ db = JSON.parse(oldRaw); }catch(e){ db = { vendors:[], products:[], sales:[], currentVendor:"" }; }
  } else {
    db = { vendors:[], products:[], sales:[], currentVendor:"" };
  }
  cryptoKey = key;
  await saveDB();
  localStorage.removeItem(OLD_DB_KEY);
  return true;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr);
  return Math.round((d-now)/86400000);
}
function fmt(n){ return Number(n||0).toLocaleString("fr-FR",{maximumFractionDigits:2}); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let tab = "vente";
let cart = {};
let searchQ = "";
let vendorFilter = "Tous";
let saleClient = "";
let saleAmountPaid = "";
let saleDebtAmount = "";

/* ---------- Rendu ---------- */
function render(){
  document.getElementById("vendorLabel").textContent = db.currentVendor || "Choisir";
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  const expired = db.products.filter(p=>daysUntil(p.expiry)<0).length;
  const soon = db.products.filter(p=>{const d=daysUntil(p.expiry);return d>=0&&d<=30;}).length;
  const alertCount = expired+soon;
  const badge = document.getElementById("alertBadge");
  badge.style.display = alertCount? "flex":"none";
  badge.textContent = alertCount;

  const debtClients = getDebtClients();
  const creditBadge = document.getElementById("creditBadge");
  creditBadge.style.display = debtClients.length? "flex":"none";
  creditBadge.textContent = debtClients.length;

  const c = document.getElementById("content");
  if(tab==="vente") c.innerHTML = renderVente();
  else if(tab==="produits") c.innerHTML = renderProduits();
  else if(tab==="alertes") c.innerHTML = renderAlertes();
  else if(tab==="rapports") c.innerHTML = renderRapports();
  else if(tab==="credits") c.innerHTML = renderCredits();
  else if(tab==="reglages") c.innerHTML = renderReglages();
  attachContentEvents();
}

function getDebtClients(){
  const map = {};
  const activeLoc = db.currentLocation || "Tous";
  db.sales.forEach(s=>{
    if(activeLoc!=="Tous" && (s.location||"Tous")!==activeLoc) return;
    if(s.paymentType==="credit" && !s.paid && s.client){
      const due = s.amountDue!=null? s.amountDue : s.total;
      map[s.client] = (map[s.client]||0) + due;
    }
  });
  return Object.entries(map).map(([name,total])=>({name,total}));
}

/* ---------- VENTE ---------- */
function renderVente(){
  const allLocations = [...new Set(db.products.map(p=>p.location).filter(Boolean))];
  const activeLoc = db.currentLocation || "Tous";
  const visibleProducts = activeLoc==="Tous" ? db.products : db.products.filter(p=>p.location===activeLoc);
  const filtered = visibleProducts.filter(p=>p.name.toLowerCase().includes(searchQ.toLowerCase()));
  let html = `<div id="confirmSlot"></div>`;

  if(allLocations.length>0){
    html += `<button id="locationBtn" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--primary);">
      <span>📍 ${esc(activeLoc)}</span><span style="color:var(--muted);">changer ▾</span>
    </button>`;
  }

  const favProducts = visibleProducts.filter(p=>p.favorite);
  if(favProducts.length>0){
    html += `<div class="section-title" style="color:var(--muted)">⚡ Produits rapides</div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:16px;">`;
    favProducts.forEach(p=>{
      const inCart = cart[p.id]||0;
      const disabled = p.quantity===0 || inCart>=p.quantity;
      html += `<button data-quickadd="${p.id}" ${disabled?'disabled':''} style="position:relative;background:${disabled?'var(--border)':'#fff'};border:1.5px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;cursor:${disabled?'default':'pointer'};">
        <div style="font-size:12px;font-weight:700;line-height:1.25;margin-bottom:3px;">${esc(p.name)}</div>
        <div style="font-size:11px;color:var(--muted);">${fmt(p.price)}</div>
        ${inCart>0? `<span style="position:absolute;top:-6px;right:-6px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;">${inCart}</span>`:''}
      </button>`;
    });
    html += `</div>`;
  }

  html += `<div style="display:flex;gap:8px;margin-bottom:12px;">
    <button class="btn-primary" id="openScanBtn" style="flex:1;background:var(--amber);">🔢 Code-barres</button>
    <button class="btn-primary" id="voiceBtn" style="flex:1;background:var(--primary);">🎙️ Mode vocal</button>
  </div>`;
  html += `<div class="search-wrap"><span class="search-icon">🔍</span><input id="searchInput" placeholder="Rechercher un produit..." value="${esc(searchQ)}"></div>`;
  if(db.products.length===0) html += `<div class="empty">Aucun produit. Ajoutez des produits dans l'onglet Produits.</div>`;
  html += `<div class="list" style="margin-bottom:${Object.keys(cart).length?180:20}px">`;
  filtered.forEach(p=>{
    const inCart = cart[p.id]||0;
    const expired = daysUntil(p.expiry)<0;
    const noPrice = p.price==null;
    html += `<div class="card prod-row" style="opacity:${(p.quantity===0||noPrice)?0.5:1}">
      <div>
        <div class="prod-name">${esc(p.name)} ${expired?'⚠️':''}</div>
        <div class="prod-sub">${noPrice? '<span style="color:var(--amber);font-weight:700;">⚠️ Prix à définir</span>' : fmt(p.price)} · Stock: ${p.quantity}${p.unit?' '+esc(p.unit)+'(s)':''}</div>
      </div>`;
    if(noPrice){
      html += `<span style="font-size:11px;color:var(--amber);font-weight:700;">Complète le prix</span>`;
    } else if(inCart===0){
      html += `<button class="qty-btn" data-add="${p.id}" ${p.quantity===0?'disabled':''}>+</button>`;
    }else{
      html += `<div class="qty-ctrl">
        <button data-dec="${p.id}">−</button>
        <span style="font-weight:700;font-size:13px;min-width:14px;text-align:center;">${inCart}</span>
        <button class="plus" data-add="${p.id}" ${inCart>=p.quantity?'disabled':''}>+</button>
      </div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;

  const cartItems = Object.entries(cart).map(([id,qty])=>{
    const p = db.products.find(x=>x.id===id);
    return p? {...p, qty} : null;
  }).filter(Boolean);

  if(cartItems.length>0){
    const recos = getRecommendations();
    if(recos.length>0){
      html += `<div class="section-title" style="color:var(--muted)">💡 Souvent acheté avec</div>`;
      html += `<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:${180}px;">`;
      recos.forEach(p=>{
        const inCart = cart[p.id]||0;
        const disabled = inCart>=p.quantity;
        html += `<button data-quickadd="${p.id}" ${disabled?'disabled':''} style="flex-shrink:0;min-width:110px;position:relative;background:${disabled?'var(--border)':'#fff'};border:1.5px solid var(--amber);border-radius:12px;padding:10px 8px;text-align:center;cursor:${disabled?'default':'pointer'};">
          <div style="font-size:12px;font-weight:700;line-height:1.25;margin-bottom:3px;">${esc(p.name)}</div>
          <div style="font-size:11px;color:var(--muted);">${fmt(p.price)}</div>
          ${inCart>0? `<span style="position:absolute;top:-6px;right:-6px;background:var(--amber);color:#fff;font-size:10px;font-weight:800;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;">${inCart}</span>`:''}
        </button>`;
      });
      html += `</div>`;
    }
  }
  const total = cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  let paidNum, remaining;
  if(saleDebtAmount!==""){
    remaining = Math.max(0, Math.min(total, Number(saleDebtAmount)||0));
    paidNum = total - remaining;
  } else {
    paidNum = saleAmountPaid===""? total : (Number(saleAmountPaid)||0);
    remaining = Math.max(0, total - paidNum);
  }
  if(cartItems.length>0){
    html += `<div class="cart-bar">
      <div class="cart-top"><span>${cartItems.reduce((s,i)=>s+i.qty,0)} article(s)</span><span class="total">${fmt(total)}</span></div>
      <input id="clientInput" placeholder="Client (optionnel)" value="${esc(saleClient)}" style="width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;margin-bottom:8px;box-sizing:border-box;">
      <input id="paidInput" type="number" placeholder="Montant payé (laisser vide = payé en entier)" value="${saleAmountPaid}" ${saleDebtAmount!==""?"disabled":""} style="width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;margin-bottom:6px;box-sizing:border-box;${saleDebtAmount!==""?"opacity:0.5;":""}">
      <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px;">— ou —</div>
      <input id="debtInput" type="number" placeholder="Montant de la dette directement" value="${saleDebtAmount}" ${saleAmountPaid!==""?"disabled":""} style="width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;margin-bottom:8px;box-sizing:border-box;${saleAmountPaid!==""?"opacity:0.5;":""}">
      <div id="remainingDisplay">${remaining>0? `<div style="font-size:12.5px;font-weight:700;color:var(--amber);margin-bottom:10px;">Reste dû (dette) : ${fmt(remaining)} · Payé : ${fmt(paidNum)}</div>` : ""}</div>
      <button class="btn-primary" id="confirmSaleBtn">Encaisser</button>
    </div>`;
  }
  return html;
}

function updateRemainingDisplay(){
  const cartItems = Object.entries(cart).map(([id,qty])=>{
    const p = db.products.find(x=>x.id===id); return p? {...p, qty} : null;
  }).filter(Boolean);
  const total = cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  let paidNum, remaining;
  if(saleDebtAmount!==""){
    remaining = Math.max(0, Math.min(total, Number(saleDebtAmount)||0));
    paidNum = total - remaining;
  } else {
    paidNum = saleAmountPaid===""? total : (Number(saleAmountPaid)||0);
    remaining = Math.max(0, total - paidNum);
  }
  const disp = document.getElementById("remainingDisplay");
  if(disp) disp.innerHTML = remaining>0? `<div style="font-size:12.5px;font-weight:700;color:var(--amber);margin-bottom:10px;">Reste dû (dette) : ${fmt(remaining)} · Payé : ${fmt(paidNum)}</div>` : "";
  const paidInput = document.getElementById("paidInput");
  const debtInput = document.getElementById("debtInput");
  if(paidInput && document.activeElement!==paidInput) paidInput.disabled = saleDebtAmount!=="";
  if(debtInput && document.activeElement!==debtInput) debtInput.disabled = saleAmountPaid!=="";
  if(paidInput) paidInput.style.opacity = saleDebtAmount!==""? "0.5":"1";
  if(debtInput) debtInput.style.opacity = saleAmountPaid!==""? "0.5":"1";
}

  }));
  const clientInput = document.getElementById("clientInput");
  if(clientInput) clientInput.addEventListener("input", e=>{ saleClient = e.target.value; });
  const paidInput = document.getElementById("paidInput");
  if(paidInput) paidInput.addEventListener("input", e=>{
    saleDebtAmount = "";
    saleAmountPaid = e.target.value;
    updateRemainingDisplay();
  });
  const debtInput = document.getElementById("debtInput");
  if(debtInput) debtInput.addEventListener("input", e=>{
    saleAmountPaid = "";
    saleDebtAmount = e.target.value;
    updateRemainingDisplay();
  });
  const confirmBtn = document.getElementById("confirmSaleBtn");
  if(confirmBtn) confirmBtn.addEventListener("click", ()=>{
    if(!db.currentVendor){ openVendorModal(); return; }
    const cartItems = Object.entries(cart).map(([id,qty])=>{
      const p = db.products.find(x=>x.id===id); return p? {...p, qty} : null;
    }).filter(Boolean);
    if(cartItems.length===0) return;
    const total = cartItems.reduce((s,i)=>s+i.price*i.qty,0);
    let paidNum, remaining;
    if(saleDebtAmount!==""){
      remaining = Math.max(0, Math.min(total, Number(saleDebtAmount)||0));
      paidNum = total - remaining;
    } else {
      paidNum = saleAmountPaid===""? total : (Number(saleAmountPaid)||0);
      remaining = Math.max(0, total - paidNum);
    }
    if(remaining>0 && !saleClient.trim()){ alert("Indique le nom du client pour enregistrer le reste comme dette."); return; }
    const sale = { id:uid(), date:new Date().toISOString(), vendor:db.currentVendor, location: db.currentLocation||"Tous",
      client: saleClient.trim(), amountPaid: Math.min(paidNum,total), amountDue: remaining, paymentType: remaining>0? "credit":"cash", paid: remaining===0,
      items: cartItems.map(i=>({productId:i.id,name:i.name,qty:i.qty,priceUnit:i.price,costUnit:i.purchasePrice||0,subtotal:i.price*i.qty})), total };
    db.sales.unshift(sale);
    db.products = db.products.map(p=> cart[p.id]? {...p, quantity:p.quantity-cart[p.id]} : p);
    cart = {}; saleClient = ""; saleAmountPaid = ""; saleDebtAmount = "";
    saveDB();
    render();
    const isBig = total >= BIG_SALE_THRESHOLD;
    const isMega = total >= MEGA_SALE_THRESHOLD;
    fireConfetti(isBig, isMega);
    if(isMega){ playMegaSaleAudio(); shineEffect(); speakCongrats(); }
    else if(isBig) playFanfare();
    else beep(760, true);
    const slot = document.getElementById("confirmSlot");
    if(slot){
      slot.innerHTML = `<div class="confirm-msg" style="display:flex;justify-content:space-between;align-items:center;">

        <button id="printLastReceipt" style="background:#fff;color:var(--primary);border:none;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;">🖨️ Reçu</button>
      </div>`;
      document.getElementById("printLastReceipt").addEventListener("click", ()=>printReceipt(sale));
      setTimeout(()=>{ if(slot) slot.innerHTML=""; },6000);
    }
  });
}

function getRecommendations(){
  const cartIds = Object.keys(cart);
  if(cartIds.length===0) return [];
  const activeLoc = db.currentLocation || "Tous";
  const coCount = {};
  db.sales.forEach(s=>{
    if(s.cancelled) return;
    const idsInSale = [...new Set(s.items.map(i=>i.productId))];
    const hasCartItem = idsInSale.some(id=>cartIds.includes(id));
    if(!hasCartItem) return;
    idsInSale.forEach(id=>{
      if(!cartIds.includes(id)) coCount[id] = (coCount[id]||0)+1;
    });
  });
  return Object.entries(coCount)
    .sort((a,b)=>b[1]-a[1])
    .map(([id])=>db.products.find(p=>p.id===id))
    .filter(p=>p && p.quantity>0 && (activeLoc==="Tous" || p.location===activeLoc))
    .slice(0,4);
}

let prodCategoryFilter = "Tous";

      html += `<button class="chip ${prodCategoryFilter===cat?'active':''}" data-catf="${esc(cat)}">${esc(cat)}</button>`;
    });

  }
  const activeLoc = db.currentLocation || "Tous";
  const shown = (prodCategoryFilter==="Tous" ? db.products : db.products.filter(p=>p.category===prodCategoryFilter))
    .filter(p=> activeLoc==="Tous" || p.location===activeLoc)
    .filter(p=> p.name.toLowerCase().includes(prodSearchQ.toLowerCase()));
  if(shown.length===0) html += `<div class="empty">Aucun produit enregistré${activeLoc!=="Tous"?` dans "${esc(activeLoc)}"`:""}.</div>`;
  html += `<div class="list">`;
  shown.forEach(p=>{

    let status = "";
    if(d<0) status = `<span class="pill" style="background:var(--red-bg);color:var(--red);">Périmé</span>`;
    else if(d<=30) status = `<span class="pill" style="background:var(--amber-bg);color:var(--amber);">${d}j restants</span>`;
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div style="flex:1;" data-edit="${p.id}">
          <div class="prod-name">${p.favorite?'⭐ ':''}${esc(p.name)}</div>
          <div class="prod-sub">${p.price!=null? fmt(p.price) : '<span style="color:var(--amber);font-weight:700;">⚠️ Prix à définir</span>'} · Stock: ${p.quantity}${p.unit?' '+esc(p.unit)+'(s)':''} · Exp: ${p.expiry}${p.category?' · '+esc(p.category):''}${p.location?' · 📍'+esc(p.location):''}</div>
          <div style="margin-top:6px;">${status}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
          <button class="trash-btn" data-fav="${p.id}" title="Accès rapide">${p.favorite?'⭐':'☆'}</button>
          <button class="trash-btn" data-voicetrain="${p.id}" title="Entraîner la voix">${(p.voiceSamples||[]).length>0?'🎙️':'🎤'}</button>
          <button class="trash-btn" data-restock="${p.id}" title="Réapprovisionner">📦</button>
          <button class="trash-btn" data-del="${p.id}">🗑️</button>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

  if(psi) psi.addEventListener("input", e=>{ prodSearchQ=e.target.value; render(); const el=document.getElementById("prodSearchInput"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} });

    e.stopPropagation();
    db.products = db.products.map(p=> p.id===el.dataset.fav? {...p, favorite: !p.favorite} : p);
    saveDB(); render();
  }));
  document.querySelectorAll("[data-voicetrain]").forEach(el=>el.addEventListener("click", (e)=>{
    e.stopPropagation();
    openVoiceTrainModal(el.dataset.voicetrain);
  }));
  document.querySelectorAll("[data-restock]").forEach(el=>el.addEventListener("click", (e)=>{

    if(!p) return;
    const qty = prompt(`Quantité reçue pour "${p.name}" (stock actuel : ${p.quantity}) :`, "");
    if(qty===null) return;
    const n = Number(qty);
    if(!n || n<=0){ alert("Entre un nombre valide supérieur à 0."); return; }
    db.products = db.products.map(x=> x.id===p.id? {...x, quantity: x.quantity+n} : x);
    saveDB(); render();
    alert(`Stock mis à jour : ${p.quantity+n} unité(s) pour ${p.name}.`);
  }));
  document.querySelectorAll("[data-edit]").forEach(el=>el.addEventListener("click", ()=>{
    const p = db.products.find(x=>x.id===el.dataset.edit);
    if(p) openProductModal(p);
  }));
  document.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click", (e)=>{
    e.stopPropagation();
    db.products = db.products.filter(p=>p.id!==el.dataset.del);
    saveDB(); render();
  }));
}

        micStatus.textContent = `✅ Entendu : "${spoken}"`;
      };
      rec.onerror = (event)=>{
        micStatus.textContent = event.error==="network"
          ? "❌ Pas de connexion internet — la dictée en a besoin pour fonctionner."
          : event.error==="not-allowed"
            ? "❌ Micro refusé. Autorise l'accès au micro dans le navigateur."
            : "❌ Erreur de dictée, réessaie.";
      };
      rec.onend = ()=>{ micBtn.style.background = "var(--amber)"; };
      rec.start();
    });
  }

  const ocrBtn = document.getElementById("fNameOcrBtn");
  if(ocrBtn) ocrBtn.addEventListener("click", openOcrModal);

  document.getElementById("saveProdBtn").addEventListener("click", ()=>{
    const name=document.getElementById("fName").value.trim();
    const barcode=document.getElementById("fBarcode").value.trim();
    const category=document.getElementById("fCategory").value.trim();
    const location=document.getElementById("fLocation").value.trim();
    const unit=document.getElementById("fUnit").value.trim();
    const cost=document.getElementById("fCost").value;
    const price=document.getElementById("fPrice").value;
    const qty=document.getElementById("fQty").value;
    const expiry=document.getElementById("fExpiry").value;
    if(!name||!qty||!expiry) return;
    const priceVal = price!==""? Number(price) : null;
    if(p){
      db.products = db.products.map(x=>x.id===p.id? {...x,name,barcode:barcode||null,category:category||null,location:location||null,unit:unit||null,purchasePrice:Number(cost)||0,price:priceVal,quantity:Number(qty),expiry} : x);
    }else{
      db.products.unshift({id:uid(),name,barcode:barcode||null,category:category||null,location:location||null,unit:unit||null,purchasePrice:Number(cost)||0,price:priceVal,quantity:Number(qty),expiry});
    }
    saveDB(); root.innerHTML=""; render();
  });
}

/* ---------- ALERTES ---------- */
function renderAlertes(){
  const activeLoc = db.currentLocation || "Tous";
  const scoped = activeLoc==="Tous" ? db.products : db.products.filter(p=>p.location===activeLoc);
  const expired = scoped.filter(p=>daysUntil(p.expiry)<0).sort((a,b)=>daysUntil(a.expiry)-daysUntil(b.expiry));
  const soon = scoped.filter(p=>{const d=daysUntil(p.expiry);return d>=0&&d<=30;}).sort((a,b)=>daysUntil(a.expiry)-daysUntil(b.expiry));
  const low = scoped.filter(p=>p.quantity>0 && p.quantity<=5);
  let html = "";
  if(expired.length===0 && soon.length===0 && low.length===0) html += `<div class="empty">Aucune alerte pour le moment. Tout est en ordre.</div>`;
  function section(title,color,items,subFn,bg){
    if(items.length===0) return "";
    let s = `<div style="margin-bottom:18px;"><div class="section-title" style="color:${color}">${title}</div><div class="list">`;
    items.forEach(p=>{
      s += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div><div class="prod-name">${esc(p.name)}</div><div class="prod-sub">Stock: ${p.quantity} · Exp: ${p.expiry}</div></div>
        <span class="pill" style="background:${bg};color:${color};white-space:nowrap;">${subFn(p)}</span>
      </div>`;
    });
    s += `</div></div>`;
    return s;
  }
  html += section("Produits périmés","var(--red)",expired,p=>`Périmé depuis ${Math.abs(daysUntil(p.expiry))}j`,"var(--red-bg)");
  html += section("Péremption proche (≤30j)","var(--amber)",soon,p=>`Expire dans ${daysUntil(p.expiry)}j`,"var(--amber-bg)");
  html += section("Stock faible (≤5)","var(--primary)",low,p=>`${p.quantity} unité(s)`,"var(--mint)");
  return html;
}

/* ---------- RAPPORTS ---------- */
function renderRapports(){
  const activeLoc = db.currentLocation || "Tous";
  const byVendor = vendorFilter==="Tous"? db.sales : db.sales.filter(s=>s.vendor===vendorFilter);
  const filtered = activeLoc==="Tous" ? byVendor : byVendor.filter(s=>(s.location||"Tous")===activeLoc);
  const active = filtered.filter(s=>!s.cancelled);
  const today = todayISO(); const monthKey = today.slice(0,7);
  const todayTotal = active.filter(s=>s.date.slice(0,10)===today).reduce((s,x)=>s+x.total,0);
  const monthTotal = active.filter(s=>s.date.slice(0,7)===monthKey).reduce((s,x)=>s+x.total,0);
  const todayCount = active.filter(s=>s.date.slice(0,10)===today).length;

  function profitOf(sList){
    return sList.reduce((sum,s)=> sum + s.items.reduce((si,i)=> si + (i.priceUnit-(i.costUnit||0))*i.qty, 0), 0);
  }
  const todayProfit = profitOf(active.filter(s=>s.date.slice(0,10)===today));
  const monthProfit = profitOf(active.filter(s=>s.date.slice(0,7)===monthKey));

  const salesCount = {};
  active.forEach(s=> s.items.forEach(i=>{ salesCount[i.name] = (salesCount[i.name]||0) + i.qty; }));
  const topProducts = Object.entries(salesCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  let html = activeLoc!=="Tous" ? `<div style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">📍 Emplacement actif : <b>${esc(activeLoc)}</b></div>` : "";
  if(db.vendors.length>0){
    html += `<div class="chips">`;
    ["Tous",...db.vendors].forEach(v=>{
      html += `<button class="chip ${vendorFilter===v?'active':''}" data-vf="${esc(v)}">${esc(v)}</button>`;
    });
    html += `</div>`;
  }
  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-label">Ventes aujourd'hui</div><div class="stat-value">${fmt(todayTotal)}</div><div class="stat-sub">${todayCount} vente(s)</div></div>
    <div class="stat-card"><div class="stat-label">Ventes ce mois-ci</div><div class="stat-value">${fmt(monthTotal)}</div><div class="stat-sub">${monthKey}</div></div>
  </div>`;
  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-label">Bénéfice aujourd'hui</div><div class="stat-value" style="color:var(--amber)">${fmt(todayProfit)}</div></div>
    <div class="stat-card"><div class="stat-label">Bénéfice ce mois-ci</div><div class="stat-value" style="color:var(--amber)">${fmt(monthProfit)}</div></div>
  </div>`;

  // Graphique des 7 derniers jours
  const days7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const total = active.filter(s=>s.date.slice(0,10)===key).reduce((s,x)=>s+x.total,0);
    days7.push({key, label: d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".",""), total});
  }
  const maxDay = Math.max(1, ...days7.map(d=>d.total));
  html += `<div class="section-title" style="color:var(--muted)">Ventes des 7 derniers jours</div>`;
  html += `<div class="card" style="margin-bottom:18px;"><div style="display:flex;align-items:flex-end;gap:6px;height:120px;">`;
  days7.forEach(d=>{
    const h = Math.max(3, Math.round((d.total/maxDay)*100));
    html += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
      <div title="${fmt(d.total)}" style="width:100%;background:${d.total>0?'var(--primary)':'var(--border)'};border-radius:4px 4px 0 0;height:${h}px;"></div>
      <div style="font-size:9.5px;color:var(--muted);margin-top:4px;text-transform:capitalize;">${d.label}</div>
    </div>`;
  });
  html += `</div></div>`;

  if(topProducts.length>0){
    html += `<div class="section-title" style="color:var(--muted)">Top produits vendus</div><div class="list" style="margin-bottom:18px;">`;
    topProducts.forEach(([name,qty],idx)=>{
      html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:10px;"><span style="color:var(--primary);font-weight:800;">#${idx+1}</span><span class="prod-name">${esc(name)}</span></div>
        <span class="pill" style="background:var(--mint);color:var(--primary);">${qty} vendu(s)</span>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<div class="section-title" style="color:var(--muted)">Historique des ventes</div>`;
  if(filtered.length===0) html += `<div class="empty">Aucune vente enregistrée.</div>`;
  html += `<div class="list">`;
  filtered.forEach(s=>{
    const dt = new Date(s.date);
    const dtStr = dt.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <div class="prod-sub">📅 ${dtStr}</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--primary);">${esc(s.vendor)}</div>
      </div>
      <div style="font-size:12.5px;margin-bottom:6px;">${s.items.map(i=>`${esc(i.name)} ×${i.qty}`).join(", ")}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-weight:700;font-size:15px;">${fmt(s.total)}</div>
        ${s.paymentType==="credit" ? `<span class="pill" style="background:${s.paid?'var(--mint)':'var(--amber-bg)'};color:${s.paid?'var(--primary)':'var(--amber)'};">${esc(s.client||'Crédit')}${s.paid?' · payé':` · dette ${fmt(s.amountDue!=null?s.amountDue:s.total)}`}</span>` : ''}
      </div>
      ${s.cancelled ? `<div style="font-size:11.5px;font-weight:700;color:var(--red);">Vente annulée</div>` : `
      <div style="display:flex;gap:8px;">
        <button data-print="${s.id}" style="flex:1;background:var(--mint);color:var(--primary);border:none;border-radius:9px;padding:8px 0;font-size:12px;font-weight:600;">🖨️ Reçu</button>
        <button data-cancel="${s.id}" style="flex:1;background:var(--red-bg);color:var(--red);border:none;border-radius:9px;padding:8px 0;font-size:12px;font-weight:600;">Annuler</button>
      </div>`}
    </div>`;
  });
  html += `</div>`;
  return html;
}

    db.sales = db.sales.map(s=> (s.paymentType==="credit" && !s.paid && s.client===name) ? {...s, paid:true, amountDue:0, amountPaid:s.total} : s);

  document.querySelectorAll("[data-partial]").forEach(b=>b.addEventListener("click", ()=>{

    const amountStr = prompt(`${name} doit ${fmt(totalDue)}.\nMontant du paiement reçu maintenant :`, "");
    if(amountStr===null) return;
    const amount = Number(amountStr);
    if(!amount || amount<=0){ alert("Entre un montant valide supérieur à 0."); return; }
    recordPartialPayment(name, amount);
    render();
  }));
}

// Applique un paiement partiel : commence par la vente à crédit la plus ancienne du client,
// solde chaque vente dans l'ordre jusqu'à épuisement du montant payé.
function recordPartialPayment(clientName, amount){
  let remainingPayment = amount;
  const clientSales = db.sales
    .filter(s=> s.paymentType==="credit" && !s.paid && s.client===clientName)
    .sort((a,b)=> new Date(a.date) - new Date(b.date));
  for(const s of clientSales){
    if(remainingPayment<=0) break;
    const due = s.amountDue!=null ? s.amountDue : s.total;
    if(remainingPayment >= due){
      s.amountPaid = (s.amountPaid||0) + due;
      s.amountDue = 0;
      s.paid = true;
      remainingPayment -= due;
    } else {
      s.amountPaid = (s.amountPaid||0) + remainingPayment;
      s.amountDue = due - remainingPayment;
      remainingPayment = 0;
    }
  }
  saveDB();
}

function beep(freq, ok){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = freq||(ok?880:220);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.25);
  }catch(e){}
}

    const notes = [523.25, 659.25, 783.99, 1046.50]; // Do Mi Sol Do
    notes.forEach((freq, i)=>{
      const t = ctx.currentTime + i*0.11;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.4);
    });
  }catch(e){}
}

// Petite mélodie originale d'environ 10 secondes, jouée pour les méga-ventes.
// Composition maison (pas une chanson existante) — gamme de Do majeur, air joyeux.
function playVictorySong(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const N = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
                C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00 };
    // Mélodie principale (note, durée en secondes)
    const melody = [
      [N.C5,0.3],[N.E5,0.3],[N.G5,0.3],[N.C5,0.3],
      [N.E5,0.45],[N.D5,0.15],[N.C5,0.45],
      [N.G4,0.3],[N.A4,0.3],[N.C5,0.6],
      [N.E5,0.3],[N.F5,0.3],[N.G5,0.9],
      [N.E5,0.3],[N.C5,0.3],[N.D5,0.3],[N.E5,0.3],
      [N.G5,0.3],[N.F5,0.3],[N.E5,0.3],[N.D5,0.3],
      [N.C5,0.6],[N.G5,0.3],[N.C5,1.2]
    ];
    // Basse simple qui accompagne en dessous
    const bass = [
      [N.C4,0.9],[N.G4,0.9],[N.A4,0.9],[N.F4,0.9],
      [N.C4,0.9],[N.G4,0.9],[N.C4,1.5],[N.G4,0.9],[N.C4,1.5]
    ];

    function schedule(notes, type, volume){
      let t = ctx.currentTime + 0.05;
      notes.forEach(([freq,dur])=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(volume, t+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t+dur*0.95);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t+dur);
        t += dur;
      });
    }
    schedule(melody, "triangle", 0.16);
    schedule(bass, "sine", 0.10);
  }catch(e){}
}

function fireConfetti(big, mega){
  const canvas = document.createElement("canvas");
  canvas.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;";
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const colors = mega ? ["#F2C14E","#E8B84B","#FFD76A","#B9812C","#FFF0C2"] : ["#0F4C4C","#B9812C","#E0703C","#2E9E6C","#D9455F","#F2C14E"];
  const count = mega ? 240 : (big ? 160 : 60);
  const particles = [];
  for(let i=0;i<count;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.3,
      r: 4 + Math.random()*(mega?7:5),
      c: colors[Math.floor(Math.random()*colors.length)],
      vy: 2 + Math.random()*(big?4:2.5),
      vx: (Math.random()-0.5)*(big?3:1.5),
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*10,
      shape: Math.random()>0.5 ? "rect":"circle"
    });
  }
  const duration = mega ? 4200 : (big ? 3200 : 1800);
  const startTime = performance.now();
  function frame(now){
    const elapsed = now - startTime;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.c;
      if(p.shape==="rect") ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      else { ctx.beginPath(); ctx.arc(0,0,p.r/1.6,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if(elapsed < duration){
      requestAnimationFrame(frame);
    } else {
      canvas.remove();
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- MODE VOCAL (100% hors ligne, empreintes vocales) ---------- */
let audioStream = null;
let audioCtx = null;

async function getAudioStream(){
  if(audioStream) return audioStream;
  audioStream = await navigator.mediaDevices.getUserMedia({audio:true});
  return audioStream;
}

// Enregistre ~1.4s d'audio et retourne une "empreinte" : une suite de vecteurs de fréquences
function recordVoiceSample(durationMs=1400){
  return new Promise(async (resolve, reject)=>{
    try{
      const stream = await getAudioStream();
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0;
      source.connect(analyser);
      const bins = analyser.frequencyBinCount; // 256
      const bandCount = 16;
      const frames = [];
      const freqData = new Uint8Array(bins);

      const interval = setInterval(()=>{
        analyser.getByteFrequencyData(freqData);
        const bands = new Array(bandCount).fill(0);
        const bandSize = Math.floor(bins/bandCount);
        for(let b=0;b<bandCount;b++){
          let sum=0;
          for(let i=b*bandSize;i<(b+1)*bandSize;i++) sum += freqData[i];
          bands[b] = sum/bandSize;
        }
        frames.push(bands);
      }, 30);

      setTimeout(()=>{
        clearInterval(interval);
        source.disconnect();
        // Enlève les frames de silence au début/à la fin (énergie trop faible)
        const energy = f => f.reduce((a,b)=>a+b,0);
        const maxE = Math.max(1, ...frames.map(energy));
        const threshold = maxE * 0.12;
        let start=0, end=frames.length-1;
        while(start<end && energy(frames[start])<threshold) start++;
        while(end>start && energy(frames[end])<threshold) end--;
        const trimmed = frames.slice(start, end+1);
        const useFrames = trimmed.length>2 ? trimmed : frames;
        // Compression logarithmique + normalisation : rend la comparaison
        // insensible au volume de la voix (parler plus fort/doucement ne change plus le résultat)
        const normalized = useFrames.map(bands=>{
          const logBands = bands.map(v=>Math.log10(v+1));
          const norm = Math.sqrt(logBands.reduce((s,v)=>s+v*v,0)) || 1;
          return logBands.map(v=>v/norm);
        });
        resolve(normalized);
      }, durationMs);
    }catch(e){ reject(e); }
  });
}

function euclidDist(a,b){
  let s=0; for(let i=0;i<a.length;i++){ const d=a[i]-b[i]; s+=d*d; }
  return Math.sqrt(s);
}

// Distance DTW entre deux séquences de vecteurs (compare des mots dits à des vitesses différentes)
function dtwDistance(seqA, seqB){
  const n=seqA.length, m=seqB.length;
  if(n===0||m===0) return Infinity;
  const D = Array.from({length:n+1}, ()=> new Array(m+1).fill(Infinity));
  D[0][0]=0;
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      const cost = euclidDist(seqA[i-1], seqB[j-1]);
      D[i][j] = cost + Math.min(D[i-1][j], D[i][j-1], D[i-1][j-1]);
    }
  }
  return D[n][m] / (n+m);
}

// Seuil recalibré pour des vecteurs normalisés (échelle 0 à ~1.4 au lieu de 0-360).
// Plus permissif : si le résultat se trompe encore trop souvent, augmente cette valeur (ex: 0.85).
// S'il reconnaît n'importe quoi n'importe comment, baisse-la (ex: 0.55).
const VOICE_MATCH_THRESHOLD = 0.68;

function findProductByVoiceSample(sample){
  // Distance la plus faible par produit (garde le meilleur échantillon de chaque produit)
  const perProduct = [];
  db.products.forEach(p=>{
    let minDist = Infinity;
    (p.voiceSamples||[]).forEach(stored=>{
      const d = dtwDistance(sample, stored);
      if(d<minDist) minDist = d;
    });
    if(minDist < Infinity) perProduct.push({ product:p, dist:minDist });
  });
  if(perProduct.length===0) return { product:null, distance:Infinity };
  perProduct.sort((a,b)=>a.dist-b.dist);
  const bestEntry = perProduct[0];
  const secondDist = perProduct.length>1 ? perProduct[1].dist : Infinity;
  // Tolérance supplémentaire : si ce produit se démarque clairement des autres
  // (bien plus proche que le 2e), on l'accepte même si un peu au-dessus du seuil strict.
  const clearWinner = secondDist!==Infinity && bestEntry.dist < secondDist*0.72;
  const effectiveThreshold = clearWinner ? VOICE_MATCH_THRESHOLD*1.35 : VOICE_MATCH_THRESHOLD;
  return { product: bestEntry.dist<=effectiveThreshold ? bestEntry.product : null, distance: bestEntry.dist };
}

let tesseractLoaded = false;
function loadTesseract(){
  return new Promise((resolve, reject)=>{
    if(window.Tesseract){ tesseractLoaded = true; resolve(); return; }
    const script = document.createElement("script");
    script.src = "https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js";
    script.onload = ()=>{ tesseractLoaded = true; resolve(); };
    script.onerror = ()=> reject(new Error("network"));
    document.head.appendChild(script);
  });
}

      </div>
    </div>
  </div>`;

  function closeOcr(){
    if(ocrStream){ ocrStream.getTracks().forEach(t=>t.stop()); ocrStream=null; }
    root.innerHTML = "";
  }
  document.getElementById("modalBg").addEventListener("click", closeOcr);

  const status = document.getElementById("ocrStatus");
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})

    .catch(()=>{ status.textContent = "❌ Impossible d'accéder à la caméra. Vérifie les autorisations."; });

      return;
    }

    status.textContent = "🔎 Lecture du texte en cours...";
    try{
      const result = await Tesseract.recognize(dataUrl, "fra", {
        logger: m=>{ if(m.status==="recognizing text") status.textContent = `🔎 Lecture... ${Math.round((m.progress||0)*100)}%`; }
      });
      const text = (result && result.data && result.data.text || "").trim();
      const lines = text.split("\n").map(l=>l.trim()).filter(l=>l.length>1);
      const box = document.getElementById("ocrResultBox");

        });
      });
    }catch(e){
      status.textContent = "❌ Erreur pendant la lecture du texte. Réessaie.";
    }
  });
}

/* ---------- RÉGLAGES ---------- */
function renderReglages(){
  let html = `<div class="section-title" style="color:var(--muted)">Sauvegarde des données</div>`;
  html += `<div class="card" style="margin-bottom:16px;">
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">Exporte une copie de sauvegarde de toutes tes données (produits, ventes, clients), ou restaure une sauvegarde précédente.</div>
    <div style="display:flex;gap:8px;">
      <button id="exportBtn" style="flex:1;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 0;font-weight:600;font-size:13px;">⬇️ Exporter</button>
      <button id="importBtn" style="flex:1;background:var(--mint);color:var(--primary);border:none;border-radius:10px;padding:11px 0;font-weight:600;font-size:13px;">⬆️ Importer</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>`;

  html += `<div class="section-title" style="color:var(--muted)">Code PIN par vendeur (optionnel)</div>`;
  if(db.vendors.length===0){
    html += `<div class="empty">Aucun vendeur pour le moment.</div>`;
  } else {
    html += `<div class="list">`;
    db.vendors.forEach(v=>{
      const hasPin = db.vendorPins && db.vendorPins[v];
      html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div class="prod-name">${esc(v)}</div>
        <div style="display:flex;gap:8px;">
          <button data-setpin="${esc(v)}" style="background:var(--mint);color:var(--primary);border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;">${hasPin?"Modifier PIN":"Définir PIN"}</button>
          ${hasPin? `<button data-clearpin="${esc(v)}" style="background:var(--red-bg);color:var(--red);border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;">Retirer</button>`:""}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

function attachReglagesEvents(){
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `pharma-caisse-sauvegarde-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  if(importBtn) importBtn.addEventListener("click", ()=> importFile.click());
  if(importFile) importFile.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!confirm("Importer cette sauvegarde ? Toutes les données actuelles seront remplacées.")) return;
        db = { vendors: parsed.vendors||[], products: parsed.products||[], sales: parsed.sales||[], currentVendor: parsed.currentVendor||"", vendorPins: parsed.vendorPins||{} };
        await saveDB();
        render();
      }catch(err){
        alert("Fichier de sauvegarde invalide.");
      }
    };
    reader.readAsText(file);
  });
  document.querySelectorAll("[data-setpin]").forEach(b=>b.addEventListener("click", ()=>{
    const v = b.dataset.setpin;
    const pin = prompt(`Nouveau PIN pour ${v} (4 chiffres) :`);
    if(pin===null) return;
    if(!/^\d{4}$/.test(pin.trim())){ alert("Le PIN doit contenir exactement 4 chiffres."); return; }
    if(!db.vendorPins) db.vendorPins = {};
    db.vendorPins[v] = pin.trim();
    saveDB(); render();
  }));
  document.querySelectorAll("[data-clearpin]").forEach(b=>b.addEventListener("click", ()=>{
    const v = b.dataset.clearpin;
    if(db.vendorPins) delete db.vendorPins[v];
    saveDB(); render();
  }));
}

/* ---------- Vendeur ---------- */
function openLocationModal(){
  const root = document.getElementById("modalRoot");
  function paint(){
    const locations = [...new Set(db.products.map(p=>p.location).filter(Boolean))];
    const active = db.currentLocation || "Tous";
    let html = `<div class="modal-bg" id="modalBg"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="title">Emplacement actif</div><button id="closeModal">✕</button></div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">Tant qu'un emplacement est sélectionné, seuls ses produits sont visibles pour la vente et la liste produits.</div>`;
    html += `<div class="vendor-item ${active==="Tous"?'selected':''}" data-selloc="Tous">Tous les emplacements ${active==="Tous"?'✓':''}</div>`;
    if(locations.length===0) html += `<div style="color:var(--muted);font-size:13px;margin:8px 0;">Aucun emplacement encore créé — ajoute-en un dans la fiche d'un produit (champ "Emplacement de stock").</div>`;
    locations.forEach(loc=>{
      html += `<div class="vendor-item ${loc===active?'selected':''}" data-selloc="${esc(loc)}">${esc(loc)} ${loc===active?'✓':''}</div>`;
    });
    html += `</div></div>`;
    root.innerHTML = html;
    document.getElementById("modalBg").addEventListener("click", ()=>{ root.innerHTML=""; });
    document.getElementById("closeModal").addEventListener("click", ()=>{ root.innerHTML=""; });
    document.querySelectorAll("[data-selloc]").forEach(el=>el.addEventListener("click", ()=>{
      db.currentLocation = el.dataset.selloc;
      saveDB(); root.innerHTML=""; render();
    }));
  }
  paint();
}

function openVendorModal(){
  const root = document.getElementById("modalRoot");
  function paint(){
    let html = `<div class="modal-bg" id="modalBg"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="title">Vendeur actif</div><button id="closeModal">✕</button></div>`;
    if(db.vendors.length===0) html += `<div style="color:var(--muted);font-size:13px;margin-bottom:12px;">Aucun vendeur. Ajoutez-en un ci-dessous.</div>`;
    db.vendors.forEach(v=>{
      html += `<div class="vendor-item ${v===db.currentVendor?'selected':''}" data-selv="${esc(v)}">${esc(v)} ${v===db.currentVendor?'✓':''}</div>`;
    });
    html += `<div style="display:flex;gap:8px;margin-top:8px;">
      <input id="newVendorInput" placeholder="Nom du nouveau vendeur" style="flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;">
      <button id="addVendorBtn" style="background:var(--primary);color:#fff;border:none;border-radius:12px;padding:0 18px;font-weight:600;">Ajouter</button>
    </div></div></div>`;
    root.innerHTML = html;
    document.getElementById("modalBg").addEventListener("click", ()=>{ root.innerHTML=""; });
    document.getElementById("closeModal").addEventListener("click", ()=>{ root.innerHTML=""; });
    document.querySelectorAll("[data-selv]").forEach(el=>el.addEventListener("click", ()=>{
      const v = el.dataset.selv;
      const pin = db.vendorPins && db.vendorPins[v];
      if(pin){
        const entered = prompt(`PIN pour ${v} :`);
        if(entered===null) return;
        if(entered.trim()!==pin){ alert("PIN incorrect."); return; }
      }
      db.currentVendor = v; saveDB(); root.innerHTML=""; render();
    }));
    document.getElementById("addVendorBtn").addEventListener("click", ()=>{
      const inp = document.getElementById("newVendorInput");
      const name = inp.value.trim();
      if(!name || db.vendors.includes(name)) return;
      db.vendors.push(name); db.currentVendor = name; saveDB();
      root.innerHTML=""; render();
    });
    document.getElementById("newVendorInput").addEventListener("keydown", (e)=>{
      if(e.key==="Enter") document.getElementById("addVendorBtn").click();
    });
  }
  paint();
}
document.getElementById("vendorBtn").addEventListener("click", openVendorModal);

document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click", ()=>{ tab=b.dataset.tab; render(); }));

const ACCESS_CODE = "F Keita"; // mot de passe historique (migration uniquement)
async function tryUnlock(){
  const btn = document.getElementById("unlockBtn");
  const val = document.getElementById("accessCodeInput").value;
  if(!val.trim()){ document.getElementById("lockError").textContent = "Entre un mot de passe."; document.getElementById("lockError").style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "Vérification...";
  const ok = await unlockWithPassword(val);
  btn.disabled = false; btn.textContent = "Entrer";
  if(ok){
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("appRoot").style.display = "block";
    render();
  } else {
    document.getElementById("lockError").textContent = "Mot de passe incorrect, réessaie.";
    document.getElementById("lockError").style.display = "block";
  }
}
document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
document.getElementById("accessCodeInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
